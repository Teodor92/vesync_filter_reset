name: Validate for HACS

on:
  push:
  pull_request:
  schedule:
    - cron: "0 4 * * *"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hacs/action@1ebf01c408f29afcb6406bd431bc98fd8cbb15aa # main @ 2026-09
        with:
          category: integration
          # Brands are for repositories published in the HACS default store.
          # This one is installed as a custom repository, so the check is not
          # applicable. Drop this ignore if brand assets are ever added under
          # custom_components/vesync_filter_reset/brand/.
          ignore: brands
